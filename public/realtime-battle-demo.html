<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>12 格對 12 格即時戰鬥示範</title>
  <style>
    :root { color-scheme: dark; font-family: "Microsoft JhengHei", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 22px; color: #f6ecd6; background: #090806; }
    .shell { width: min(100%, 980px); margin: auto; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
    h1 { margin: 0; color: #f4d793; font-size: 22px; }
    button { padding: 10px 22px; border: 1px solid #e2b85b; border-radius: 7px; color: #241608; background: linear-gradient(#f5d990, #c69138); font: inherit; font-weight: 800; cursor: pointer; }
    button:disabled { filter: grayscale(1); cursor: not-allowed; }
    .stage-scroll { overflow-x: auto; border: 1px solid #645333; background: #050403; }
    #battle-stage { position: relative; width: 900px; height: 500px; overflow: hidden; background: radial-gradient(circle at 50% 45%, #49402e 0 8%, transparent 35%), linear-gradient(180deg, #12191d 0 58%, #211b14 58% 100%); box-shadow: inset 0 0 90px #000; }
    #battle-stage::before { content: ""; position: absolute; inset: 290px 0 0; opacity: .55; background: repeating-linear-gradient(104deg, transparent 0 48px, #77664a22 49px 51px); transform: perspective(220px) rotateX(18deg); }
    .camp-label { position: absolute; top: 16px; z-index: 1; padding: 5px 12px; border: 1px solid currentColor; border-radius: 999px; background: #080706bb; font-weight: 800; letter-spacing: .12em; }
    .camp-label.player { left: 32px; color: #72d8b2; }
    .camp-label.enemy { right: 32px; color: #ff9184; }
    .divider { position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: linear-gradient(transparent, #e2b85b99, transparent); }
    .divider::after { content: "VS"; position: absolute; top: 46%; left: 50%; transform: translate(-50%, -50%); padding: 7px; border: 1px solid #d8aa50; border-radius: 50%; color: #f7d889; background: #20160d; font-weight: 900; }
    .unit { --facing: 1; position: absolute; z-index: 2; width: 68px; height: 88px; transform: translate(-50%, -50%); transition: opacity .4s ease, filter .15s ease; }
    .unit.enemy { --facing: -1; }
    .bars { position: absolute; top: 0; left: 2px; width: 64px; display: grid; gap: 2px; }
    .bar { height: 6px; overflow: hidden; border: 1px solid #0a0907; border-radius: 4px; background: #211c16; }
    .bar > i { display: block; width: 100%; height: 100%; transition: width .16s linear; }
    .hp i { background: linear-gradient(90deg, #35a65d, #75e58e); }
    .mp i { background: linear-gradient(90deg, #b17b18, #ffd64c); }
    .portrait { position: absolute; top: 18px; left: 4px; display: grid; place-items: center; width: 60px; height: 60px; border: 3px solid #63b99c; border-radius: 50%; color: #fff; background: radial-gradient(circle at 35% 30%, #6cbca5, #174b3f 66%, #0d2721); box-shadow: 0 5px 15px #000a; font-size: 28px; }
    .enemy .portrait { border-color: #d66b5e; background: radial-gradient(circle at 35% 30%, #c87b67, #61261f 66%, #2b100d); }
    .name { position: absolute; top: 79px; left: 50%; width: 108px; overflow: hidden; transform: translateX(-50%); color: #f8ead0; font-size: 12px; font-weight: 800; text-align: center; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 2px 3px #000; }
    .unit.attacking { animation: lunge .26s ease-in-out; }
    .unit.hit { animation: hit .28s ease-in-out; }
    .unit.dead { opacity: 0; filter: grayscale(1); pointer-events: none; }
    .damage { position: absolute; z-index: 10; color: #ff5b49; font-size: 22px; font-weight: 900; text-shadow: 0 2px 2px #240000; pointer-events: none; animation: float-damage .8s ease-out forwards; }
    @keyframes lunge { 0%,100% { transform: translate(-50%,-50%) translateX(0); } 48% { transform: translate(-50%,-50%) translateX(calc(var(--facing) * 20px)); } }
    @keyframes hit { 0%,100% { filter: none; } 30%,70% { filter: drop-shadow(0 0 12px #ff2f1f) brightness(1.8); } }
    @keyframes float-damage { from { opacity: 1; transform: translate(-50%,0) scale(.8); } to { opacity: 0; transform: translate(-50%,-54px) scale(1.18); } }
    .status { display: grid; grid-template-columns: 1fr 360px; gap: 12px; margin-top: 12px; }
    .panel { min-height: 112px; padding: 12px; border: 1px solid #5d4b2f; background: #15110c; }
    .panel strong { color: #f0ce80; }
    #event-log { height: 120px; overflow: auto; margin: 8px 0 0; color: #c9c0af; font: 12px/1.5 Consolas, monospace; }
    #event-log div:first-child { color: #fff0c8; }
    .legend { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; color: #c9c0af; font-size: 13px; }
    @media (max-width: 760px) { body { padding: 10px; } .status { grid-template-columns: 1fr; } .toolbar { align-items: flex-start; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="toolbar">
      <h1>傭兵即時戰鬥｜左方我軍 vs 右方敵軍</h1>
      <button id="start-button" type="button">開始戰鬥</button>
    </div>
    <div class="stage-scroll" aria-label="900 x 500 即時戰場">
      <section id="battle-stage">
        <b class="camp-label player">我方</b>
        <b class="camp-label enemy">敵方</b>
        <div class="divider" aria-hidden="true"></div>
      </section>
    </div>
    <section class="status">
      <div class="panel">
        <strong id="battle-status">等待開始</strong>
        <div class="legend"><span>我方：col 3 為前排</span><span>敵方：col 0 為前排</span><span>綠條：HP</span><span>黃條：MP</span></div>
      </div>
      <div class="panel"><strong>Event Log</strong><div id="event-log" aria-live="polite"></div></div>
    </section>
  </main>

  <script>
    "use strict";

    // 將 3 列 × 4 行的邏輯座標轉換成 900 × 500 戰場中的像素座標。
    // 我方 col 越大越靠近中央；敵方 col 越小越靠近中央。
    function gridToPixel(side, row, col) {
      const y = 120 + row * 145;
      const x = side === "player" ? 75 + col * 88 : 561 + col * 88;
      return { x, y };
    }

    class Unit {
      constructor({ id, name, side, row, col, hp, atk, def, attackInterval, icon }) {
        this.id = id;
        this.name = name;
        this.side = side;
        this.position = { row, col };
        this.maxHp = hp;
        this.hp = hp;
        this.atk = atk;
        this.def = def;
        this.attackInterval = attackInterval;
        this.cooldown = 0;
        this.mp = 0;
        this.icon = icon;
        this.alive = true;
      }
    }

    class BattleSystem {
      constructor(units, onEvent) {
        this.units = units;
        this.onEvent = onEvent;
        this.elapsed = 0;
        this.running = false;
        this.lastFrame = 0;
        this.frameId = 0;
      }

      startBattle() {
        this.running = true;
        this.elapsed = 0;
        this.lastFrame = performance.now();
        // 開局所有存活單位立即完成第一次鎖敵與攻擊。
        [...this.units].filter(unit => unit.alive).forEach(unit => this.attack(unit));
        this.frameId = requestAnimationFrame(time => this.loop(time));
      }

      loop(time) {
        if (!this.running) return;
        const deltaTime = Math.min((time - this.lastFrame) / 1000, 0.1);
        this.lastFrame = time;
        this.update(deltaTime);
        if (this.running) this.frameId = requestAnimationFrame(next => this.loop(next));
      }

      update(deltaTime) {
        this.elapsed += deltaTime;
        for (const unit of this.units) {
          if (!unit.alive) continue;
          unit.cooldown -= deltaTime;
          if (unit.cooldown <= 0) this.attack(unit);
        }
        const playersAlive = this.units.some(unit => unit.side === "player" && unit.alive);
        const enemiesAlive = this.units.some(unit => unit.side === "enemy" && unit.alive);
        if (!playersAlive || !enemiesAlive) {
          this.running = false;
          this.emit("BATTLE_END", { winner: playersAlive ? "player" : "enemy" });
        }
      }

      findTarget(attacker) {
        const targets = this.units.filter(unit => unit.side !== attacker.side && unit.alive);
        targets.sort((a, b) => {
          const rowDifference = Math.abs(a.position.row - attacker.position.row) - Math.abs(b.position.row - attacker.position.row);
          if (rowDifference !== 0) return rowDifference;
          // 敵方前排為 col 0；我方前排為 col 3。
          return attacker.side === "player"
            ? a.position.col - b.position.col
            : b.position.col - a.position.col;
        });
        return targets[0] ?? null;
      }

      attack(attacker) {
        const target = this.findTarget(attacker);
        if (!target) return;
        attacker.cooldown = attacker.attackInterval;
        const damage = Math.max(1, Math.round(attacker.atk * (100 / (100 + target.def))));
        attacker.mp = Math.min(100, attacker.mp + 20);
        this.emit("ATTACK", { source: attacker, target });
        target.hp = Math.max(0, target.hp - damage);
        this.emit("TAKE_DAMAGE", { source: attacker, target, damage });
        if (target.hp === 0) {
          target.alive = false;
          this.emit("DIE", { source: attacker, target });
        }
      }

      emit(type, payload) {
        this.onEvent({ type, time: Math.round(this.elapsed * 1000), ...payload });
      }

      stop() {
        this.running = false;
        cancelAnimationFrame(this.frameId);
      }
    }

    const stage = document.querySelector("#battle-stage");
    const startButton = document.querySelector("#start-button");
    const battleStatus = document.querySelector("#battle-status");
    const eventLog = document.querySelector("#event-log");
    const sprites = new Map();
    let battle = null;

    function createSprite(unit) {
      const point = gridToPixel(unit.side, unit.position.row, unit.position.col);
      const element = document.createElement("article");
      element.className = `unit ${unit.side}`;
      element.dataset.unitId = unit.id;
      element.style.left = `${point.x}px`;
      element.style.top = `${point.y}px`;
      element.innerHTML = `
        <div class="bars">
          <div class="bar hp"><i></i></div>
          <div class="bar mp"><i></i></div>
        </div>
        <div class="portrait" aria-hidden="true">${unit.icon}</div>
        <div class="name">${unit.name}</div>`;
      stage.appendChild(element);
      sprites.set(unit.id, element);
      updateBars(unit);
    }

    function updateBars(unit) {
      const element = sprites.get(unit.id);
      if (!element) return;
      element.querySelector(".hp i").style.width = `${unit.hp / unit.maxHp * 100}%`;
      element.querySelector(".mp i").style.width = `${unit.mp}%`;
    }

    // 將數值系統事件轉成 DOM 動畫；核心戰鬥類別本身不依賴畫面。
    function playEventLog(event) {
      if (event.type === "ATTACK") {
        const attacker = sprites.get(event.source.id);
        if (attacker) restartAnimation(attacker, "attacking");
        updateBars(event.source);
        addLog(`[${event.time}ms] ${event.source.name} 攻擊 ${event.target.name}`);
      }

      if (event.type === "TAKE_DAMAGE") {
        const target = sprites.get(event.target.id);
        if (target) {
          restartAnimation(target, "hit");
          updateBars(event.target);
          const damage = document.createElement("b");
          damage.className = "damage";
          damage.textContent = `-${event.damage}`;
          damage.style.left = target.style.left;
          damage.style.top = `${parseFloat(target.style.top) - 48}px`;
          stage.appendChild(damage);
          damage.addEventListener("animationend", () => damage.remove(), { once: true });
        }
        addLog(`[${event.time}ms] ${event.target.name} 受到 ${event.damage} 傷害，HP ${event.target.hp}/${event.target.maxHp}`);
      }

      if (event.type === "DIE") {
        const target = sprites.get(event.target.id);
        if (target) {
          target.classList.add("dead");
          target.addEventListener("transitionend", () => target.remove(), { once: true });
        }
        addLog(`[${event.time}ms] ${event.target.name} 倒下`);
      }

      if (event.type === "BATTLE_END") {
        battleStatus.textContent = event.winner === "player" ? "戰鬥結束：我方勝利" : "戰鬥結束：敵方勝利";
        startButton.disabled = false;
        startButton.textContent = "重新戰鬥";
        addLog(`[${event.time}ms] 戰鬥結束`);
      }
    }

    function restartAnimation(element, className) {
      element.classList.remove(className);
      void element.offsetWidth;
      element.classList.add(className);
      element.addEventListener("animationend", () => element.classList.remove(className), { once: true });
    }

    function addLog(message) {
      const line = document.createElement("div");
      line.textContent = message;
      eventLog.prepend(line);
      while (eventLog.children.length > 80) eventLog.lastElementChild.remove();
    }

    function createTestUnits() {
      const playerData = [
        ["p1", "近戰傭兵", 1, 3, 1100, 138, 55, 1.25, "⚔"],
        ["p2", "護衛武士", 0, 3, 1450, 112, 90, 1.55, "🛡"],
        ["p3", "遠程弓手", 1, 1, 820, 166, 32, 1.05, "🏹"],
        ["p4", "商團術士", 2, 0, 760, 188, 28, 1.75, "✦"],
        ["p5", "長槍兵", 2, 3, 1050, 148, 50, 1.35, "♜"]
      ];
      const enemyData = [
        ["e1", "赤賊先鋒", 1, 0, 1050, 132, 48, 1.2, "☠"],
        ["e2", "山寨盾兵", 0, 0, 1500, 105, 95, 1.65, "◆"],
        ["e3", "鐵炮倭寇", 1, 2, 780, 174, 30, 1.1, "✹"],
        ["e4", "邪靈巫女", 2, 3, 720, 194, 25, 1.8, "☯"],
        ["e5", "狂虎護衛", 2, 0, 1180, 145, 58, 1.4, "虎"]
      ];
      return [...playerData.map(data => makeUnit("player", data)), ...enemyData.map(data => makeUnit("enemy", data))];
    }

    function makeUnit(side, [id, name, row, col, hp, atk, def, attackInterval, icon]) {
      return new Unit({ id, name, side, row, col, hp, atk, def, attackInterval, icon });
    }

    function resetBattle() {
      battle?.stop();
      stage.querySelectorAll(".unit, .damage").forEach(element => element.remove());
      sprites.clear();
      eventLog.replaceChildren();
      const units = createTestUnits();
      units.forEach(createSprite);
      battle = new BattleSystem(units, playEventLog);
      battleStatus.textContent = "戰鬥進行中：雙方獨立攻速、自動重新鎖敵";
      startButton.disabled = true;
      battle.startBattle();
    }

    startButton.addEventListener("click", resetBattle);
    createTestUnits().forEach(createSprite);
  </script>
</body>
</html>
