name: Bug 回報
description: 回報可重現的遊戲問題
title: "[Bug]: "
labels: ["🐞 bug", "🧪 testing"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 問題說明
      description: 實際發生什麼？預期應該如何？
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      label: 重現步驟
      placeholder: "1. ...\n2. ...\n3. ..."
    validations: { required: true }
  - type: input
    id: save
    attributes: { label: 存檔／版本資訊 }
  - type: textarea
    id: evidence
    attributes: { label: 截圖、錯誤訊息或其他證據 }
